databases:
  - name: ashen-crown-db
    databaseName: ashen_crown
    user: ashen_user
    plan: free

services:
  - type: web
    name: ashen-crown-backend
    env: java
    region: oregon
    plan: free
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: java -jar backend/target/ashen-crown-backend-1.0.0.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: ashen-crown-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ashen-crown-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ashen-crown-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ashen-crown-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ashen-crown-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
